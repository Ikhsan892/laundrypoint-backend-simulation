name: release

# Build & push the image to Docker Hub (tiul/laundrypoint) ONLY when a semver tag
# is pushed to this backend repo (e.g. `make release V=v1.0.0`). No branch/PR builds.
# The frontend is expected to be prebuilt into ./public and committed
# (run `make web` before tagging).
#
# Required repo secret: DOCKERHUB_TOKEN — a Docker Hub access token for user `tiul`
# (hub.docker.com → Account Settings → Personal access tokens, scope Read & Write).
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  DOCKERHUB_USERNAME: tiul
  IMAGE: tiul/laundrypoint

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail if frontend build is missing
        run: |
          test -f public/index.html || {
            echo "::error::public/index.html not found. Run 'make web' and commit ./public before tagging.";
            exit 1;
          }

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # v1.2.3 → 1.2.3, 1.2, v1.2.3, latest. `latest` is skipped for pre-releases
      # (v1.2.3-rc.1) because metadata-action's flavor defaults to latest=auto.
      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
